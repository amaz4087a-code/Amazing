version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: sprots-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sprots
      POSTGRES_PASSWORD: sprots_dev
      POSTGRES_DB: sprots
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sprots"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: sprots-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://sprots:sprots_dev@postgres:5432/sprots
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-in-production}
      NEXTAUTH_URL: http://localhost:3000
    volumes:
      - uploads_data:/app/uploads

volumes:
  postgres_data:
  uploads_data:
